name: Notification api

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/**
      - tests/**
      - .github/workflows/notification.api.yml

env:
  SERVICE: notification.api

jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  SmokeTest:
    runs-on: ubuntu-latest
    needs: UnitTest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: elwark_notification
          POSTGRES_USER: master_account
          POSTGRES_PASSWORD: master_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Build Docker image
        run: docker compose build ${{ env.SERVICE }}
        env:
          TAG: smoke

      - name: Run container
        run: |
          docker run -d --name notification_smoke \
            --network host \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e Kestrel__EndPoints__Http__Url=http://+:5004 \
            -e ConnectionStrings__Postgresql="Host=localhost;Database=elwark_notification;Username=master_account;Password=master_password" \
            -e Authentication__Authority=http://localhost:5000 \
            -e Authentication__Audience=elwark.notification.api \
            -e People__Host=http://localhost:5001 \
            -e People__ClientId=elwark.notification.api \
            -e People__ClientSecret=secret \
            -e People__Scope=elwark.people \
            -e Sendgrid__Key=test \
            -e Resend__Key=test \
            elwark/notification/api:smoke

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5004/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "API did not start in time"
          exit 1

      - name: Smoke test - health check is Healthy
        run: |
          STATUS=$(curl -sf http://localhost:5004/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "Healthy" ]

      - name: Print container logs
        if: failure()
        run: docker logs notification_smoke

  BuildContainer:
    runs-on: ubuntu-latest
    needs: SmokeTest
    steps:
      - name: Checkout Github Action
        uses: actions/checkout@master

      - name: Compose build ${{ env.SERVICE }}
        run: sudo -E docker compose build ${{ env.SERVICE }} --no-cache
        working-directory: .
        shell: bash
        env:
          TAG: ${{ github.sha }}
